<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Family</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e2e8f0; --text:#1e293b;
    --muted:#64748b; --accent:#2563eb; --accent2:#0ea5e9;
    --male:#3b82f6; --female:#ec4899; --dead:#94a3b8;
    --danger:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:45}
  header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .brand{display:flex;align-items:center;gap:8px}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#f1f5f9}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .btn.sm{padding:4px 8px;font-size:12px}
  .btn:disabled{opacity:.35;cursor:default}
  .iconbtn{font-size:18px;padding:5px 11px;line-height:1}
  .drivestatus{font-size:12px;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
  .drivestatus.off{background:#f1f5f9;color:#64748b}
  .drivestatus.saving{background:#fef9c3;color:#854d0e}
  .drivestatus.saved{background:#dcfce7;color:#15803d}
  .drivestatus.error{background:#fee2e2;color:#b91c1c}
  /* ikon (Lucide) */
  .ic{display:inline-block;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex-shrink:0}
  .ic.lg{width:44px;height:44px;stroke-width:1.6}
  .ic.xl{width:60px;height:60px;stroke-width:1.6}
  .ic.spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px}
  .focuspick .sic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .focuspick .search{padding-left:32px!important}
  /* menu lainnya */
  .menuwrap{position:relative}
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);min-width:230px;padding:6px;display:none;z-index:60}
  .menu.show{display:block}
  .menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit}
  .menu button:hover{background:#f1f5f9}
  .menu button.danger{color:var(--danger)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
  .main{display:flex;flex:1;min-height:0;position:relative;overflow:hidden}  /* potong laci yg tersembunyi agar HP tidak memperkecil halaman */
  .backdrop{position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.show{opacity:1;pointer-events:auto}
  /* sidebar = drawer (sembunyi sampai dibutuhkan) */
  .sidebar{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:85%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.12)}
  .sidebar.open{transform:none}
  .sidebar .top{padding:10px;border-bottom:1px solid var(--line)}
  .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .people{overflow-y:auto;flex:1;padding:6px}
  .pcard{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
  .pcard:hover{background:#f1f5f9}
  .pcard.active{background:#e0edff}
  .pcard .nm{font-size:13px;font-weight:600;line-height:1.2}
  .pcard .sub{font-size:11px;color:var(--muted)}
  .count{font-size:11px;color:var(--muted);padding:4px 10px}
  /* avatar */
  .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;position:relative}
  .av.male{background:var(--male)} .av.female{background:var(--female)} .av.unknown{background:#a3a3a3}
  .av.dead{filter:grayscale(1) brightness(.9)}
  .av .cross{position:absolute;right:-3px;bottom:-3px;background:#fff;border-radius:50%;width:15px;height:15px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#475569;border:1px solid var(--line)}
  /* detail */
  .detail{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;position:relative}
  .detail .empty{padding:30px 18px;color:var(--muted);text-align:center;font-size:14px;line-height:1.6}
  .dhead{padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;border-bottom:1px solid var(--line);text-align:center}
  .dhead .bigav{width:72px;height:72px;font-size:28px}
  .dhead .nm{font-size:18px;font-weight:700}
  .dhead .pg{font-size:13px;color:var(--muted)}
  .dhead .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#f1f5f9;color:var(--muted)}
  .badge.dead{background:#f1f5f9;color:#475569}
  .badge.me{background:#e0edff;color:var(--accent)}
  .panggil{margin:12px 18px 4px;padding:12px 14px;border-radius:12px;background:#f0f7ff;border:1px solid #dbeafe}
  .panggil .pk{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .panggil .pv{font-size:20px;font-weight:700;color:var(--accent);margin:2px 0}
  .panggil .pd{font-size:12px;color:#334155;line-height:1.45}
  .panggil .pn{font-size:10.5px;color:var(--muted);margin-top:6px}
  .panggil.muted{background:#f8fafc;border-color:var(--line);font-size:12.5px;color:var(--muted);line-height:1.5}
  .field{padding:8px 18px;display:flex;font-size:13px;border-bottom:1px solid #f1f5f9}
  .field .k{width:90px;color:var(--muted);flex-shrink:0}
  .field .v{flex:1}
  .rels{padding:12px 18px}
  .rels h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .relrow{display:flex;align-items:center;gap:8px;padding:5px;border-radius:8px;cursor:pointer}
  .relrow:hover{background:#f1f5f9}
  .relrow .nm{font-size:13px}
  .relrow .ord{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .relrow .reorder{display:flex;gap:2px;margin-left:auto}
  .relrow .reorder .btn{padding:2px 7px;line-height:1}
  .actions{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-top:1px solid var(--line)}
  /* tree */
  .treewrap{flex:1;position:relative;overflow:hidden;min-width:0;background:
     radial-gradient(circle, #e2e8f0 1px, transparent 1px); background-size:22px 22px}
  .treebar{position:absolute;top:10px;left:10px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);max-width:calc(100% - 20px)}
  .viewseg{display:flex;background:#f1f5f9;border-radius:9px;padding:2px;flex-shrink:0}
  .viewseg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
  .viewseg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .focuspick{position:relative;flex:1;min-width:0}
  .focuspick .search{width:240px;max-width:100%;padding:7px 10px}
  .focuslist{position:absolute;top:100%;left:0;min-width:100%;width:280px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:300px;overflow:auto;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.14);display:none}
  .focuslist.show{display:block}
  .focuslist .fitem{padding:7px 10px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .focuslist .fitem:hover{background:#f1f5f9}
  .zoombtns{position:absolute;bottom:14px;right:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
  .zoombtns .btn{width:38px;height:38px;justify-content:center;font-size:18px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  #svg{width:100%;height:100%;cursor:grab;touch-action:none;display:block}
  #svg.grabbing{cursor:grabbing}
  .node rect{fill:#fff;stroke:var(--line);stroke-width:1.5}
  .node.sel rect{stroke:var(--accent);stroke-width:2.5}
  .node text.nm{font-size:12.5px;font-weight:600;fill:var(--text)}
  .node text.sub{font-size:11px;fill:var(--muted)}
  .node{cursor:pointer}
  .node.draggable{cursor:grab}
  .node.focus rect{stroke:var(--accent2);stroke-width:3}
  .node.me rect{fill:#f0f7ff}
  .tog{cursor:pointer}
  .tog rect{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
  .tog.closed rect{fill:var(--accent);stroke:var(--accent)}
  .tog text{font-size:11px;font-weight:700;fill:#475569;pointer-events:none}
  .tog.closed text{fill:#fff}
  .tog:hover rect{stroke:var(--accent);stroke-width:2}
  #genlayer{pointer-events:none}
  .gen rect{fill:rgba(255,255,255,.92);stroke:#e2e8f0}
  .gen text{font-size:10.5px;font-weight:700;fill:#64748b;letter-spacing:.04em}
  .link{fill:none;stroke:#94a3b8;stroke-width:1.5}
  .marriage{stroke:#cbd5e1;stroke-width:2}
  .marriage.divorced{stroke:#cbd5e1;stroke-dasharray:5 4}
  .treeempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;flex-direction:column;gap:14px}
  /* tampilan daftar */
  .listview{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:66px 14px 80px;z-index:4}
  .listview[hidden]{display:none}
  .olup{font-size:13px;color:var(--muted);margin:0 0 10px 4px}
  .olup a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .olrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid var(--line);margin:4px 0;max-width:640px}
  .olrow:hover{border-color:#bfdbfe}
  .olrow.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .olrow .av{width:32px;height:32px;font-size:13px}
  .olrow .oltx{flex:1;min-width:0}
  .olrow .nm{font-size:13.5px;font-weight:600;line-height:1.25}
  .olrow .sub{font-size:11.5px;color:var(--muted)}
  .olrow .sp{font-size:11.5px;color:#475569}
  .olrow .sp a{color:inherit;text-decoration:underline dotted;cursor:pointer}
  .olrow .ord{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .olrow .tg{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;flex-shrink:0;font-size:12px;color:#475569}
  .olrow .tg.blank{visibility:hidden}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:#e0edff;color:var(--accent);white-space:nowrap;flex-shrink:0}
  .olkids{margin-left:22px;padding-left:12px;border-left:2px solid #dbe3ee}
  .olgen{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px 4px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:70}
  .modal{background:#fff;border-radius:14px;width:420px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}
  .mbody{padding:16px 18px}
  .frow{margin-bottom:12px}
  .frow label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .frow input,.frow select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
  .pickitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
  .pickitem:hover{background:#f1f5f9}
  .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
  .detailclose{display:none;position:absolute;top:8px;right:8px;z-index:3;border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
  /* huruf besar (untuk sesepuh) */
  body.big header, body.big .sidebar, body.big .detail, body.big .listview, body.big .modal, body.big .treebar, body.big .menu, body.big .zoombtns{zoom:1.2}
  /* ===== formulir isi data (ramah HP) ===== */
  .fab{position:absolute;left:14px;bottom:14px;z-index:5;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:13px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(37,99,235,.35);cursor:pointer;font-family:inherit}
  .wiz{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center}
  .wizbox{background:#fff;width:480px;max-width:100%;height:min(780px,96vh);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .wizhead{padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .wizhead h3{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wzsync{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:4px 9px;border-radius:20px;background:#f1f5f9;color:#64748b;white-space:nowrap}
  .wzsync.saved{background:#dcfce7;color:#15803d} .wzsync.saving{background:#fef9c3;color:#854d0e} .wzsync.error{background:#fee2e2;color:#b91c1c}
  .wizsteps{display:flex;gap:6px;padding:10px 18px 0}
  .wizsteps span{flex:1;height:5px;border-radius:5px;background:#e2e8f0}
  .wizsteps span.on{background:var(--accent)}
  .wizbody{flex:1;overflow:auto;padding:8px 18px 24px;-webkit-overflow-scrolling:touch}
  .wizfoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
  .wizfoot .btn{flex:1;justify-content:center;padding:14px;font-size:16px;border-radius:12px;font-weight:600}
  .wf label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px;color:#334155}
  .wf input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;background:#fff}
  .wf input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #dbeafe}
  .wf .bad,.big-seg.bad{border-color:var(--danger)!important;box-shadow:0 0 0 3px #fee2e2;border-radius:12px}
  .big-seg{display:flex;gap:8px}
  .big-seg.wrap{flex-wrap:wrap}
  .big-seg button{flex:1;padding:13px 10px;font-size:15.5px;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;font-family:inherit;color:var(--text)}
  .big-seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .choice{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;text-align:left;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text)}
  .choice:hover:not([disabled]){border-color:#93c5fd}
  .choice[disabled]{cursor:default;opacity:1}
  .choice .ctxt{flex:1;min-width:0;display:flex;flex-direction:column}
  .choice .np{color:var(--muted);font-weight:400}
  .choice .ctx{font-size:12.5px;color:var(--muted);margin-top:2px}
  .choice.addnew{border-style:dashed;color:var(--accent)}
  .choice .pickbtn{font-size:12px;padding:5px 10px;border-radius:20px;background:#e0edff;color:var(--accent);font-weight:600;white-space:nowrap}
  .wnote{background:#f0f7ff;border:1px solid #dbeafe;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:10px 0}
  .wnote.small{font-size:13px;color:#334155}
  .simbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:8px 10px;margin-top:8px}
  .simt{font-size:13px;font-weight:600;color:#9a3412;margin:2px 2px 4px}
  .selbox{font-size:13px;color:#15803d;font-weight:600;margin-top:8px}
  .subcard{border:1.5px solid #dbeafe;background:#fbfdff;border-radius:14px;padding:4px 14px 14px;margin-top:14px}
  .subt{font-weight:700;font-size:15px;margin-top:12px}
  .wbtn{width:100%;justify-content:center;padding:14px;font-size:16px;border-radius:12px;margin-top:16px;font-weight:600}
  .kidrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff}
  .kidrow .ctxt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14.5px}
  .kidrow .ctx{font-size:12px;color:var(--muted)}
  .kidrow .ord{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kbtn{width:40px;height:40px;justify-content:center;font-size:16px;padding:0}
  /* ===== MOBILE ===== */
  @media (max-width:760px){
    header{gap:6px;padding:7px 10px}
    header h1{font-size:16px}
    header .brand{display:none}
    .drivestatus .stx{display:none}
    .drivestatus{padding:6px 9px}
    .detail{position:absolute;top:0;right:0;bottom:0;width:90%;max-width:360px;z-index:40;transform:translateX(100%);transition:transform .22s ease;box-shadow:-2px 0 18px rgba(0,0,0,.14);border-left:1px solid var(--line)}
    .detail.open{transform:none}
    .detailclose{display:flex}
    .sidebar{width:86%}
    .treebar{left:8px;right:8px;top:8px;max-width:none}
    .focuspick .search{width:100%}
    .viewseg button{padding:6px 8px}
    .viewseg .lbl{display:none}
    .zoombtns .btn{width:44px;height:44px}
    .listview{padding:60px 8px 80px}
    .olkids{margin-left:6px;padding-left:6px}
    .olrow{gap:6px;padding:6px}
    .olrow .av{width:28px;height:28px;font-size:12px}
    .olrow .tg{width:24px;height:24px}
    .actions .btn,.relrow .reorder .btn{padding:7px 10px}
    .wizbox{width:100%;height:100%;border-radius:0}
    .frow input,.search,.modal input{font-size:16px}   /* cegah iPhone memperbesar layar saat mengetik */
    .fab{bottom:16px;left:12px}
  }
</style>
</head>
<body>

<script>
/* ============ DATA MODEL ============
 state = { people:[{id,namaLengkap,namaPanggilan,telepon,domisili,tahunLahir,jk:'L'|'P'|'',status:'hidup'|'wafat'}],
           unions:[{id,partners:[id..(1-2)],children:[id..],status?:'cerai'}],
           settings?:{homeId} }
   - union dengan 2 partner = pasangan menikah
   - union dengan 1 partner = orang tua tunggal
   - settings.homeId = orang yang dipusatkan saat aplikasi dibuka
*/
const ic=(n,c='')=>`<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;   // ikon Lucide dari sprite di atas
let state = load() || {people:[], unions:[]};
let selectedId = null;
let rootId = null;
let view = {x:60,y:60,k:1};
let nodePos = {};      // pid -> {x,y} pusat kotak (koordinat layout) untuk drag
let nodeDrag = null;   // status drag kotak anak di canvas
let viewMode = lsGet('silsilah-view')==='list' ? 'list' : 'tree';
let meId = lsGet('silsilah-me');   // "Saya" di perangkat ini -> dasar panggilan

/* ---------- persistence ---------- */
function save(){ localStorage.setItem('silsilah-data', JSON.stringify(state)); schedulePush(); }
function load(){ try{ return JSON.parse(localStorage.getItem('silsilah-data')); }catch(e){ return null; } }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function uid(p){ return p+Math.random().toString(36).slice(2,9); }

/* ---------- queries ---------- */
const P = id => state.people.find(p=>p.id===id);
const unionsOf = id => state.unions.filter(u=>u.partners.includes(id));
function spousesOf(id){ const s=[]; unionsOf(id).forEach(u=>u.partners.forEach(pid=>{ if(pid!==id) s.push(pid); })); return s; }
function childrenOf(id){ const c=[]; unionsOf(id).forEach(u=>u.children.forEach(ch=>c.push(ch))); return c; }
// utamakan orang tua yang berpasangan bila seseorang tercatat di lebih dari satu keluarga
const parentUnionOf = id => state.unions.find(u=>u.children.includes(id)&&u.partners.length===2) || state.unions.find(u=>u.children.includes(id));
function parentsOf(id){ const u=parentUnionOf(id); return u?u.partners:[]; }
function homeId(){ const h=state.settings&&state.settings.homeId; return h&&P(h)?h:null; }
const fullName = id => (P(id)||{}).namaLengkap||'(tanpa nama)';

/* ---------- mutations ---------- */
function addPerson(data){ const id=uid('p'); state.people.push({id,...data}); save(); return id; }
function addSpouse(a,b){
  if(state.unions.some(u=>u.partners.includes(a)&&u.partners.includes(b))){ save(); return; }
  // kalau salah satu sudah punya "keluarga" sendirian (anak ditambah sebelum nikah),
  // jadikan union itu sebagai pernikahan -> anak otomatis jadi milik berdua
  const single=state.unions.find(u=>u.partners.length===1 && (u.partners[0]===a||u.partners[0]===b));
  if(single) single.partners.push(single.partners[0]===a?b:a);
  else state.unions.push({id:uid('u'),partners:[a,b],children:[]});
  save();
}
// rapikan data: gabungkan union orang-tua-tunggal ke pernikahan bila tak ambigu, buang union kosong
function repairUnions(){
  state.people.forEach(p=>{
    const us=unionsOf(p.id);
    const married=us.filter(u=>u.partners.length===2);
    const single=us.filter(u=>u.partners.length===1 && u.partners[0]===p.id);
    if(married.length===1 && single.length){
      single.forEach(su=>{ su.children.forEach(c=>{ if(!married[0].children.includes(c)) married[0].children.push(c); }); su.children=[]; });
    }
  });
  state.unions=state.unions.filter(u=>u.partners.length>=2 || u.children.length>0);
}
function addChild(parentId, childId){
  // pilih union yg punya pasangan; kalau tidak ada, buat union orang tua tunggal
  let u = unionsOf(parentId).find(x=>x.partners.length===2) || unionsOf(parentId)[0];
  if(!u){ u={id:uid('u'),partners:[parentId],children:[]}; state.unions.push(u); }
  if(!u.children.includes(childId)) u.children.push(childId);
  save();
}
function addParent(childId, parentId){
  let u = parentUnionOf(childId);
  if(u){ if(!u.partners.includes(parentId) && u.partners.length<2) u.partners.push(parentId); }
  else state.unions.push({id:uid('u'),partners:[parentId],children:[childId]});
  save();
}
function deletePerson(id){
  state.people = state.people.filter(p=>p.id!==id);
  state.unions.forEach(u=>{ u.partners=u.partners.filter(x=>x!==id); u.children=u.children.filter(x=>x!==id); });
  state.unions = state.unions.filter(u=>u.partners.length>0 || u.children.length>0);
  if(meId===id){ meId=null; lsSet('silsilah-me',null); }
  save();
}
function setHome(id){ state.settings=Object.assign({},state.settings,{homeId:id}); save(); }

/* ============ PANGGILAN (kebiasaan Jawa) ============ */
// jarak ke semua leluhur: id -> {d: berapa generasi ke atas, via: anak dari leluhur itu di jalur ini}
function ancestorsDist(id){
  const res=new Map([[id,{d:0,via:null}]]);
  let frontier=[id];
  for(let d=1; frontier.length && d<15; d++){
    const next=[];
    frontier.forEach(x=>parentsOf(x).forEach(par=>{ if(!res.has(par)){ res.set(par,{d,via:x}); next.push(par); } }));
    frontier=next;
  }
  return res;
}
// hubungan darah terdekat a -> b
function bloodRel(a,b){
  const A=ancestorsDist(a), B=ancestorsDist(b);
  let best=null;
  A.forEach((ia,anc)=>{ const ib=B.get(anc); if(!ib) return;
    const s=ia.d+ib.d;
    if(!best || s<best.s) best={s,up:ia.d,down:ib.d,cA:ia.via,cB:ib.via,anc:[anc]};
    else if(s===best.s && ia.d===best.up) best.anc.push(anc);
  });
  return best;
}
// apakah x lebih tua (urutan lahir) dari y; null = belum diketahui
function olderThan(x,y){
  if(!x||!y||x===y) return null;
  const ux=parentUnionOf(x), uy=parentUnionOf(y);
  if(ux && ux===uy) return ux.children.indexOf(x) < ux.children.indexOf(y);
  const tx=parseInt((P(x)||{}).tahunLahir), ty=parseInt((P(y)||{}).tahunLahir);
  if(tx && ty && tx!==ty) return tx<ty;
  return null;
}
// g = berapa generasi orang itu di atas "saya" (negatif = di bawah)
function callTerm(g, senior, jk, direct){
  const L = jk!=='P';
  if(g>=5) return 'Mbah';
  if(g===4) return 'Mbah Canggah';
  if(g===3) return 'Mbah Buyut';
  if(g===2) return L?'Mbah Kakung':'Mbah Putri';
  if(g===1){
    if(direct) return L?'Bapak':'Ibu';
    if(senior===null) return L?'Pakde / Paklik':'Bude / Bulik';
    return senior ? (L?'Pakde':'Bude') : (L?'Paklik':'Bulik');
  }
  if(g===0){
    if(senior===null) return (L?'Mas':'Mbak')+' / Dik';
    return senior ? (L?'Mas':'Mbak') : 'Dik';
  }
  return L ? 'Le / nama' : 'Nduk / nama';
}
function relLabel(up,down,jk,senior){
  const L = jk!=='P', g=up-down;
  if(down===0) return ({1:L?'Ayah':'Ibu',2:L?'Kakek':'Nenek',3:'Buyut',4:'Canggah',5:'Wareng'})[up]||'Leluhur';
  if(up===0) return ({1:'Anak',2:'Cucu',3:'Cicit (buyut)',4:'Canggah'})[down]||'Keturunan';
  if(g===0){
    if(up===1) return senior===null ? 'Saudara kandung' : (senior?'Kakak kandung':'Adik kandung');
    return ({2:'Sepupu (sedulur misan)',3:'Sepupu dua kali (sedulur mindho)',4:'Sepupu tiga kali (sedulur mentelu)'})[up]||'Saudara jauh';
  }
  if(g===1) return down===1 ? 'Saudara kandung orang tuamu' : down===2 ? 'Sepupu orang tuamu' : 'Kerabat satu generasi di atasmu';
  if(g===2 && down===1) return 'Saudara kakek/nenekmu';
  if(g===-1) return up===1 ? 'Keponakan' : up===2 ? 'Anak sepupumu' : 'Kerabat satu generasi di bawahmu';
  if(g===-2 && up===1) return 'Cucu keponakan';
  return g>0 ? `Kerabat ${g} generasi di atasmu` : `Kerabat ${-g} generasi di bawahmu`;
}
function ancText(r){ return r.anc.length && r.up>0 && r.down>0 ? 'Leluhur bersama: '+r.anc.map(fullName).join(' & ') : ''; }
function seniorOf(r){ return (r.cA&&r.cB) ? olderThan(r.cB,r.cA) : null; }
function relationTo(me,t){
  if(!me||!t||!P(me)||!P(t)) return null;
  if(me===t) return {self:true};
  const pt=P(t);
  if(spousesOf(me).includes(t)) return {call:'Nama / panggilan sayang', label:pt.jk==='P'?'Istrimu':'Suamimu', desc:''};
  // 1) hubungan darah
  const r=bloodRel(me,t);
  if(r){ const sen=seniorOf(r), g=r.up-r.down;
    return {call:callTerm(g,sen,pt.jk,r.down===0), label:relLabel(r.up,r.down,pt.jk,sen), desc:ancText(r)}; }
  // 2) dia pasangan dari kerabat sedarahku (mis. istri pakde = bude)
  for(const s of spousesOf(t)){
    const r2=bloodRel(me,s); if(!r2) continue;
    const sen=seniorOf(r2), g=r2.up-r2.down, ps=P(s);
    let label;
    if(r2.up===0 && r2.down===1) label='Menantu';
    else if(r2.up===1 && r2.down===1) label='Ipar';
    else if(r2.down===0 && r2.up===1) label=pt.jk==='P'?'Ibu tiri / istri ayahmu':'Ayah tiri / suami ibumu';
    else label=(pt.jk==='P'?'Istri':'Suami')+' dari '+relLabel(r2.up,r2.down,ps.jk,sen).toLowerCase();
    return {call:callTerm(g,sen,pt.jk,false), label, desc:(pt.jk==='P'?'Istri ':'Suami ')+fullName(s)};
  }
  // 3) dia kerabat sedarah dari pasanganku (mertua, ipar, dll)
  for(const s of spousesOf(me)){
    const r3=bloodRel(s,t); if(!r3) continue;
    const sen=seniorOf(r3), g=r3.up-r3.down, sw=P(s).jk==='P'?'istrimu':'suamimu';
    let label = (r3.up===1&&r3.down===0) ? 'Mertua' : (r3.up===1&&r3.down===1) ? 'Ipar' : relLabel(r3.up,r3.down,pt.jk,sen)+' dari '+sw;
    return {call:callTerm(g,sen,pt.jk,r3.down===0), label, desc:'Lewat '+sw+', '+fullName(s)};
  }
  return null;
}
function callWithAlm(rel,t){
  const p=P(t); if(!rel||!rel.call) return '';
  return (p.status==='wafat' ? (p.jk==='P'?'Almh. ':'Alm. ') : '') + rel.call;
}

/* ============ RENDER: TREE (descendants) ============ */
const BOX_W=176,BOX_H=60,H_GAP=24,COUPLE_GAP=18,V_GAP=80;
// buka-tutup cabang: default terbuka sampai kedalaman autoDepth, bisa diubah manual per orang
let openOverride={}, autoDepth=99, autoRoot=null, lastOpen={};
function isOpen(pid,depth){ return (pid in openOverride) ? openOverride[pid] : depth<autoDepth; }
function buildTree(rootPid, visited, depth){
  if(visited.has(rootPid)) return null;
  visited.add(rootPid);
  const us=unionsOf(rootPid);
  const nKids=us.reduce((s,u)=>s+u.children.length,0);
  const open=isOpen(rootPid,depth);
  const unions=us.map(u=>{
    const spId=u.partners.find(x=>x!==rootPid)||null;
    const kids=open ? u.children.map((c,i)=>{ const n=buildTree(c,visited,depth+1); if(n) n.order=i+1; return n; }).filter(Boolean) : [];
    let childrenW=0;
    if(kids.length) childrenW=kids.reduce((s,k)=>s+k.subtreeW,0)+H_GAP*(kids.length-1);
    return {spouseId:spId, divorced:u.status==='cerai', kids, childrenW};
  });
  const nspouse=unions.filter(u=>u.spouseId).length;
  const coupleW=BOX_W + nspouse*(COUPLE_GAP+BOX_W);
  const withKids=unions.filter(u=>u.kids.length);
  let childrenTotal=withKids.reduce((s,u)=>s+u.childrenW,0);
  if(withKids.length>1) childrenTotal+=H_GAP*(withKids.length-1);
  const subtreeW=Math.max(coupleW, childrenTotal, BOX_W);
  return {pid:rootPid, unions, coupleW, subtreeW, nKids, open};
}
function placeTree2(node,x,depth,out){
  const y=depth*(BOX_H+V_GAP);
  const unions=node.unions;
  const withKids=unions.filter(u=>u.kids.length);
  let childrenTotal=withKids.reduce((s,u)=>s+u.childrenW,0);
  if(withKids.length>1) childrenTotal+=H_GAP*(withKids.length-1);
  // letakkan blok anak (per pernikahan) berderet, terpusat dalam subtree
  let cursor=x+(node.subtreeW-childrenTotal)/2;
  unions.forEach(u=>{
    if(u.kids.length){
      let kx=cursor; const centers=[];
      u.kids.forEach(k=>{ placeTree2(k,kx,depth+1,out); centers.push(k._cx); kx+=k.subtreeW+H_GAP; });
      u._kidsCenter=(centers[0]+centers[centers.length-1])/2;
      cursor+=u.childrenW+H_GAP;
    } else u._kidsCenter=null;
  });
  const py=y+BOX_H/2, childTop=(depth+1)*(BOX_H+V_GAP)-BOX_H/2, togY=y+BOX_H/2+14;
  let mainX;
  if(unions.length<=1){
    // kasus umum: pasangan tunggal terpusat di atas anak-anaknya (tampilan klasik)
    const u=unions[0];
    const spouse=u&&u.spouseId;
    const coupleW=BOX_W+(spouse?COUPLE_GAP+BOX_W:0);
    const center=(u&&u.kids.length)?u._kidsCenter:(x+node.subtreeW/2);
    const coupleLeft=center-coupleW/2;
    mainX=coupleLeft+BOX_W/2; node._cx=mainX;
    out.nodes.push({pid:node.pid,x:mainX,y,blood:true,order:node.order});
    const spX=coupleLeft+BOX_W+COUPLE_GAP+BOX_W/2;
    if(spouse){
      out.nodes.push({pid:spouse,x:spX,y,blood:false});
      out.marriages.push({x1:mainX,x2:spX,y,divorced:u.divorced});
    }
    const parentX=spouse?(mainX+spX)/2:mainX;
    if(u&&u.kids.length) u.kids.forEach(k=>out.links.push({x1:parentX,y1:py,x2:k._cx,y2:childTop}));
    if(node.nKids) out.toggles.push({pid:node.pid,x:parentX,y:togY,open:node.open,n:node.nKids});
  } else {
    // banyak pernikahan (mis. cerai lalu menikah lagi): orang ini di kiri, tiap pasangan di atas anaknya
    mainX=x+BOX_W/2; node._cx=mainX;
    out.nodes.push({pid:node.pid,x:mainX,y,blood:true,order:node.order});
    let lastX=mainX;
    unions.forEach(u=>{
      let spX=u.kids.length?u._kidsCenter:(lastX+COUPLE_GAP+BOX_W);
      if(spX<lastX+COUPLE_GAP+BOX_W) spX=lastX+COUPLE_GAP+BOX_W;
      lastX=spX;
      if(u.spouseId){
        out.nodes.push({pid:u.spouseId,x:spX,y,blood:false});
        out.marriages.push({x1:mainX,x2:spX,y,divorced:u.divorced});
      }
      if(u.kids.length){
        const originX=u.spouseId?spX:mainX;
        u.kids.forEach(k=>out.links.push({x1:originX,y1:py,x2:k._cx,y2:childTop}));
      }
    });
    if(node.nKids) out.toggles.push({pid:node.pid,x:mainX,y:togY,open:node.open,n:node.nKids});
  }
}
// --- tata letak LELUHUR (ke atas dari fokus) ---
function measureAnc(pid,visited){
  if(visited.has(pid)) return {pid,w:BOX_W,parents:[]};
  visited.add(pid);
  const parents=parentsOf(pid).map(p=>measureAnc(p,visited));
  let w=BOX_W;
  if(parents.length){ const pw=parents.reduce((s,p)=>s+p.w,0)+H_GAP*(parents.length-1); w=Math.max(BOX_W,pw); }
  return {pid,w,parents};
}
function placeAnc(node,x,depth,out){
  const y=-depth*(BOX_H+V_GAP);
  let centerX;
  if(node.parents.length){
    const pw=node.parents.reduce((s,p)=>s+p.w,0)+H_GAP*(node.parents.length-1);
    let cx=x+(node.w-pw)/2; const centers=[];
    node.parents.forEach(p=>{ placeAnc(p,cx,depth+1,out); centers.push(p._cx); cx+=p.w+H_GAP; });
    centerX=(centers[0]+centers[centers.length-1])/2;
  } else centerX=x+node.w/2;
  node._cx=centerX;
  if(depth>0) out.nodes.push({pid:node.pid,x:centerX,y,anc:true});   // fokus (depth 0) sudah digambar bagian keturunan
  if(node.parents.length){
    const py=-(depth+1)*(BOX_H+V_GAP);
    const cs=node.parents.map(p=>p._cx);
    const midX=(cs[0]+cs[cs.length-1])/2;
    if(node.parents.length===2) out.marriages.push({x1:cs[0],x2:cs[1],y:py});
    out.ancLinks.push({x1:centerX,y1:y-BOX_H/2,x2:midX,y2:py+BOX_H/2});
  }
}
function pickDefaultRoot(){
  if(rootId && P(rootId)) return rootId;
  if(homeId()) return homeId();
  // orang tertua yg punya anak & tanpa orang tua tercatat
  const cand=state.people.filter(p=>parentsOf(p.id).length===0 && childrenOf(p.id).length>0);
  return (cand[0]||state.people[0])?.id||null;
}
function minK(){ return (isMobile()?0.78:0.72) * (document.body.classList.contains('big')?1.15:1); }
// pilih kedalaman cabang yang terbuka otomatis supaya pohon masih terbaca di layar ini
function chooseAutoDepth(){
  const W=(svg.getBoundingClientRect().width||1000)-40;
  openOverride={};
  for(let d=6; d>=1; d--){ autoDepth=d; const t=buildTree(rootId,new Set(),0); if(t.subtreeW*minK()<=W) return; }
  autoDepth=1;
}
function setFocus(id){ if(!P(id))return; rootId=id; selectedId=id; refresh(); fit(); }
function goHome(){ const h=homeId()||pickDefaultRoot(); if(h){ rootId=null; autoRoot=null; rootId=h; selectedId=null; refresh(); fit(); } }
function renderTree(){
  const vp=document.getElementById('viewport');
  const empty=document.getElementById('treeEmpty');
  rootId=pickDefaultRoot();
  if(!rootId){ vp.innerHTML=''; document.getElementById('genlayer').innerHTML=''; genRows=[]; empty.style.display='flex'; return; }
  empty.style.display='none';
  if(autoRoot!==rootId){ autoRoot=rootId; chooseAutoDepth(); }
  const tree=buildTree(rootId,new Set(),0);
  const out={nodes:[],links:[],marriages:[],ancLinks:[],toggles:[]};
  placeTree2(tree,0,0,out);
  // leluhur ke atas, dipusatkan di kotak fokus
  const anc=measureAnc(rootId,new Set());
  placeAnc(anc, tree._cx-anc.w/2, 0, out);
  let html='';
  // label generasi di sisi kiri (Generasi 1 = baris paling atas yang tampil)
  const ys=[...new Set(out.nodes.map(n=>n.y))].sort((a,b)=>a-b);
  genRows=ys;
  document.getElementById('genlayer').innerHTML=ys.map((y,i)=>`<g class="gen" transform="translate(8,-100)"><rect width="84" height="20" rx="10"/><text x="42" y="14" text-anchor="middle">GENERASI ${i+1}</text></g>`).join('');
  out.links.concat(out.ancLinks).forEach(l=>{
    const mid=(l.y1+l.y2)/2;

  lastOpen={};
  out.toggles.forEach(t=>{

  });
  vp.innerHTML=html;
  vp.querySelectorAll('.node').forEach(el=>{
    el.addEventListener('mousedown',e=>startNodeDrag(e,el.dataset.id));
    el.addEventListener('dblclick',()=>setFocus(el.dataset.id));
  });
  applyView();
}
// buka/tutup cabang tanpa membuat layar "melompat": orang yg diklik tetap di posisi yg sama
function toggleBranch(pid){
  const before=nodePos[pid];
  openOverride[pid]=!lastOpen[pid];
  renderTree();
  const after=nodePos[pid];
  if(before&&after){ view.x+=(before.x-after.x)*view.k; view.y+=(before.y-after.y)*view.k; applyView(); }
}

/* ============ RENDER: DAFTAR (outline) ============ */
let listClosed={};
function renderOutline(){
  const el=document.getElementById('listView');
  const isList=viewMode==='list';
  el.hidden=!isList;
  document.getElementById('zoomBtns').style.display=isList?'none':'';
  document.getElementById('btnWizard').style.zIndex=isList?7:5;
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===viewMode));
  if(!isList) return;
  const root=pickDefaultRoot();
  if(!root){ el.innerHTML='<div class="olup">Belum ada data.</div>'; return; }
  const pa=parentsOf(root);
  let html=pa.length?`<div class="olup">${ic('arrow-up')} Orang tua: ${pa.map(id=>`<a data-focus="${id}">${esc(fullName(id))}</a>`).join(' &amp; ')}</div>`:'';
  html+=outlineNode(root,0,new Set());
  el.innerHTML=html;
  el.querySelectorAll('[data-focus]').forEach(a=>a.onclick=()=>setFocus(a.dataset.focus));
  el.querySelectorAll('[data-sel]').forEach(a=>a.onclick=e=>{ e.stopPropagation(); select(a.dataset.sel); });
  el.querySelectorAll('.olrow').forEach(r=>{ r.onclick=()=>select(r.dataset.id); r.ondblclick=()=>setFocus(r.dataset.id); });
  el.querySelectorAll('.tg[data-tg]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); listClosed[b.dataset.tg]=!listClosed[b.dataset.tg]; renderOutline(); });
}
function outlineNode(pid,depth,seen){
  if(seen.has(pid)) return ''; seen.add(pid);
  const p=P(pid); if(!p) return '';
  const us=unionsOf(pid), kids=us.flatMap(u=>u.children.map((c,i)=>({c,i})));
  const closed=!!listClosed[pid];
  const pu=parentUnionOf(pid), ord=depth>0&&pu?pu.children.indexOf(pid)+1:0;
  const spouses=us.filter(u=>u.partners.length===2).map(u=>{ const s=u.partners.find(x=>x!==pid);
    return `<a data-sel="${s}">${esc(fullName(s))}</a>${u.status==='cerai'?' (cerai)':''}`; });
  const rel=meId&&meId!==pid?relationTo(meId,pid):null;
  const sub=[p.namaPanggilan&&p.namaPanggilan!==p.namaLengkap?'“'+p.namaPanggilan+'”':'', p.tahunLahir, p.domisili].filter(Boolean).join(' · ');
  let html=`<div class="olrow ${pid===selectedId?'sel':''}" data-id="${pid}">
    <button class="tg ${kids.length?'':'blank'}" ${kids.length?`data-tg="${pid}"`:''} title="${closed?'Buka':'Tutup'}">${closed?ic('chevron-right'):ic('chevron-down')}</button>
    ${ord?`<span class="ord">${ord}</span>`:''}${avatarHTML(p)}
    <div class="oltx"><div class="nm">${esc(p.namaLengkap||'(tanpa nama)')}${p.status==='wafat'?' <span style="color:var(--muted);font-weight:400">✝</span>':''}</div>
      ${sub?`<div class="sub">${esc(sub)}</div>`:''}
      ${spouses.length?`<div class="sp">${ic('heart')} ${spouses.join(', ')}</div>`:''}</div>
    ${pid===meId?'<span class="chip">'+ic('user-round')+' Kamu</span>':rel?`<span class="chip" title="${esc(rel.label)}">${esc(rel.call)}</span>`:''}
  </div>`;
  if(kids.length && !closed){
    html+=`<div class="olkids">${kids.map(k=>outlineNode(k.c,depth+1,seen)).join('')}</div>`;
  }
  return html;
}

/* ============ PAN / ZOOM (mouse, sentuh & cubit) ============ */
const svg=document.getElementById('svg');
let genRows=[];
function applyView(){
  document.getElementById('viewport').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  // label generasi: x tetap di tepi kiri, y mengikuti baris pohon
  document.querySelectorAll('#genlayer .gen').forEach((g,i)=>{ const y=view.y+(genRows[i]-BOX_H/2)*view.k-24; g.setAttribute('transform',`translate(8,${y})`); });
}
let drag=null, pinch=null, tap=null, lastTap=null; const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{
  // catat calon "ketukan" (tombol cabang, atau kotak orang di layar sentuh)
  tap={pid:e.pointerId,x:e.clientX,y:e.clientY,tog:e.target.closest('.tog'),node:e.target.closest('.node')};
  if(tap.tog) return;
  if(e.target.closest('.node') && e.pointerType==='mouse') return;   // mouse di kotak = pilih / geser urutan
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.pointerType==='mouse'){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
  if(ptrs.size===1){ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; svg.classList.add('grabbing'); }
  else if(ptrs.size===2){
    drag=null; const [a,b]=[...ptrs.values()], r=svg.getBoundingClientRect();
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k,vx:view.x,vy:view.y,cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top};
  }
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && ptrs.size>=2){
    const [a,b]=[...ptrs.values()], f=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;
    view.k=pinch.k*f; view.x=pinch.cx-(pinch.cx-pinch.vx)*f; view.y=pinch.cy-(pinch.cy-pinch.vy)*f; applyView();
  } else if(drag){ view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); applyView(); }
});
function ptrEnd(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){ drag=null; svg.classList.remove('grabbing'); }
  else if(ptrs.size===1){ const p=[...ptrs.values()][0]; drag={x:p.x,y:p.y,vx:view.x,vy:view.y}; }
}
svg.addEventListener('pointercancel',e=>{ tap=null; ptrEnd(e); });
svg.addEventListener('pointerup',e=>{
  const t=tap; tap=null; ptrEnd(e);
  if(!t || t.pid!==e.pointerId || Math.hypot(e.clientX-t.x,e.clientY-t.y)>8) return;
  if(t.tog){ toggleBranch(t.tog.dataset.tog); return; }
  if(t.node && e.pointerType!=='mouse'){          // sentuh: ketuk = pilih, ketuk 2× = pusatkan
    const id=t.node.dataset.id, now=Date.now();
    if(lastTap && lastTap.id===id && now-lastTap.t<400){ lastTap=null; setFocus(id); }
    else { lastTap={id,t:now}; select(id); }
  }
});
// --- drag kotak anak di canvas untuk mengurutkan ulang (mouse) ---
function startNodeDrag(e,pid){
  if(e.button!==0) return;
  e.stopPropagation();                 // jangan picu geser canvas
  nodeDrag={pid,x0:e.clientX,y0:e.clientY,moved:false};
}
window.addEventListener('mousemove',e=>{
  if(!nodeDrag) return;
  if(!nodeDrag.moved && Math.hypot(e.clientX-nodeDrag.x0,e.clientY-nodeDrag.y0)>5){
    if(!document.querySelector(`.node.draggable[data-id="${nodeDrag.pid}"]`)) return;
    nodeDrag.moved=true; document.body.style.userSelect='none';
  }
  if(nodeDrag.moved){
    const g=document.querySelector(`.node[data-id="${nodeDrag.pid}"]`), base=nodePos[nodeDrag.pid];
    if(g&&base){ const dx=(e.clientX-nodeDrag.x0)/view.k; g.setAttribute('transform',`translate(${base.x-BOX_W/2+dx},${base.y-BOX_H/2})`); g.style.opacity='0.75'; }
  }
});
window.addEventListener('mouseup',e=>{
  if(!nodeDrag) return;
  const nd=nodeDrag; nodeDrag=null; document.body.style.userSelect='';
  if(!nd.moved){ select(nd.pid); return; }   // gerakan kecil = klik biasa -> pilih orang
  const u=parentUnionOf(nd.pid);
  if(!u || u.children.length<2){ renderTree(); return; }
  const r=svg.getBoundingClientRect();
  const cursorX=(e.clientX-r.left-view.x)/view.k;        // posisi kursor pada koordinat layout
  const sibs=u.children.filter(id=>id!==nd.pid);
  const visibleSibs=sibs.filter(id=>nodePos[id]);        // saudara yg sedang tampil di pohon
  if(!visibleSibs.length){ renderTree(); toast('Untuk mengurutkan orang ini, tampilkan pohon dari orang tuanya, atau pakai tombol ↑/↓ di rincian.'); return; }
  let idx=0; visibleSibs.forEach(id=>{ if(nodePos[id].x < cursorX) idx++; });
  const order=[...sibs]; order.splice(idx,0,nd.pid);
  u.children=order; save(); renderDetail(); renderTree();
});
svg.addEventListener('wheel',e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.9; const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f; view.k*=f; applyView(); },{passive:false});
function zoomBy(f){ const r=svg.getBoundingClientRect(), cx=r.width/2, cy=r.height/2; view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k*=f; applyView(); }
document.getElementById('zoomIn').onclick=()=>zoomBy(1.2);
document.getElementById('zoomOut').onclick=()=>zoomBy(1/1.2);
document.getElementById('zoomFit').onclick=fit;
// pas ke layar, tapi tidak lebih kecil dari batas terbaca; pohon diletakkan di tengah
function fit(){
  const vp=document.getElementById('viewport'); const b=vp.getBBox(); if(!b.width)return;
  const r=svg.getBoundingClientRect();
  const top=Math.max(0,document.getElementById('treebar').getBoundingClientRect().bottom-r.top)+12;
  const availW=r.width-24, availH=r.height-top-16;
  let k=Math.min(availW/(b.width+40), availH/(b.height+40), 1.25);
  k=Math.max(k,minK());
  view.k=k;
  const f=nodePos[rootId];
  if(b.width*k<=availW) view.x=(r.width-b.width*k)/2-b.x*k;
  else view.x=r.width/2-(f?f.x:b.x+b.width/2)*k;
  if(b.height*k<=availH) view.y=top+Math.min((availH-b.height*k)/2,40)-b.y*k;
  else view.y=top+availH*0.3-(f?f.y:b.y)*k;
  applyView();
}

/* ============ FORMULIR ISI DATA (ramah HP, untuk pengisian massal) ============
   Langkah: siapa → profil → pasangan → anak → orang tua → selesai.
   Setiap "Simpan" langsung tersimpan (dan tersinkron bila memakai server keluarga). */
let wz=null;
const WZ_STEPS=['profil','pasangan','anak','ortu'];
const nick = id => { const p=P(id)||{}; return p.namaPanggilan||p.namaLengkap||'(tanpa nama)'; };
function personCtx(id){
  const p=P(id); if(!p) return '';
  const pa=parentsOf(id).map(nick), sp=spousesOf(id).map(nick);
  return [pa.length?'anak dari '+pa.join(' & '):'', !pa.length&&sp.length?'pasangan dari '+sp.join(', '):'', p.tahunLahir, p.domisili, p.status==='wafat'?'✝':''].filter(Boolean).join(' · ');
}
function normName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function searchPeople(q,exclude=[]){
  const n=normName(q); if(!n) return [];
  const toks=n.split(' ');
  return state.people.filter(p=>!exclude.includes(p.id)).map(p=>{
    const hay=normName(p.namaLengkap+' '+(p.namaPanggilan||''));
    const score=toks.every(t=>hay.includes(t)) ? (hay.startsWith(n)?3:2) : toks.some(t=>t.length>=3 && hay.split(' ').some(w=>w.startsWith(t))) ? 1 : 0;
    return {p,score};
  }).filter(x=>x.score).sort((a,b)=>b.score-a.score||(a.p.namaLengkap||'').localeCompare(b.p.namaLengkap||'')).slice(0,25).map(x=>x.p);
}
function choiceHTML(p,attr,extra=''){
  return `<button class="choice" ${attr}>${avatarHTML(p)}<span class="ctxt"><b>${esc(p.namaLengkap||'(tanpa nama)')}</b>${p.namaPanggilan&&p.namaPanggilan!==p.namaLengkap?` <span class="np">“${esc(p.namaPanggilan)}”</span>`:''}<span class="ctx">${esc(personCtx(p.id))}</span></span>${extra}</button>`;
}
function domisiliOptions(){
  const set=new Set(state.people.map(p=>(p.domisili||'').trim()).filter(d=>d&&d!=='-'&&d.toLowerCase()!=='tidak diketahui'));
  return `<datalist id="wzDom">${[...set].sort().map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`;
}
// kolom isian orang (dipakai untuk profil, pasangan, anak, orang tua)
function personFieldsHTML(pre,p,opt={}){
  p=p||{}; const jk=p.jk||opt.jk||'';
  return `<div class="wf">
    <label>Nama lengkap *</label><input id="${pre}nl" value="${esc(p.namaLengkap||'')}" placeholder="Nama lengkap" autocomplete="off" autocapitalize="words">
    <div id="${pre}sim"></div>
    <label>Nama panggilan</label><input id="${pre}np" value="${esc(p.namaPanggilan||'')}" placeholder="mis. Yekti, Pak De No" autocapitalize="words">
    <label>Jenis kelamin *</label><div class="big-seg" id="${pre}jk"><button type="button" data-v="L" class="${jk==='L'?'on':''}">${ic('mars')} Laki-laki</button><button type="button" data-v="P" class="${jk==='P'?'on':''}">${ic('venus')} Perempuan</button></div>
    <label>Tahun lahir</label><input id="${pre}th" value="${esc(p.tahunLahir||'')}" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="mis. 1975 (boleh dikosongkan)">
    ${opt.short?'':`<label>Nomor HP / WA</label><input id="${pre}tel" type="tel" value="${esc(p.telepon&&p.telepon!=='-'?p.telepon:'')}" placeholder="08…">
    <label>Domisili sekarang</label><input id="${pre}dom" list="wzDom" value="${esc(p.domisili&&p.domisili!=='-'?p.domisili:'')}" placeholder="Kecamatan, Kabupaten/Kota">`}
    <label>Status</label><div class="big-seg" id="${pre}st"><button type="button" data-v="hidup" class="${p.status!=='wafat'?'on':''}">Masih hidup</button><button type="button" data-v="wafat" class="${p.status==='wafat'?'on':''}">Telah wafat</button></div>
  </div>`;
}
function bindSeg(root){ root.querySelectorAll('.big-seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)))); }
function readPerson(root,pre){
  const v=id=>{ const el=root.querySelector('#'+pre+id); return el?el.value.trim():undefined; };
  const seg=id=>root.querySelector('#'+pre+id+' button.on')?.dataset.v||'';
  const d={namaLengkap:v('nl'),namaPanggilan:v('np'),jk:seg('jk'),tahunLahir:(v('th')||'').replace(/\D/g,'').slice(0,4),status:seg('st')||'hidup'};
  if(v('tel')!==undefined) d.telepon=v('tel');
  if(v('dom')!==undefined) d.domisili=v('dom');
  return d;
}
function validPerson(root,pre,d){
  const bad=(id,msg)=>{ const el=root.querySelector('#'+pre+id); if(el){ el.classList.add('bad'); el.scrollIntoView({block:'center',behavior:'smooth'}); } toast(msg,'error'); return false; };
  root.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  if(!d.namaLengkap) return bad('nl','Nama lengkap wajib diisi');
  if(!d.jk) return bad('jk','Pilih jenis kelamin');
  if(d.tahunLahir && (d.tahunLahir<1850 || d.tahunLahir>new Date().getFullYear())) return bad('th','Tahun lahir tidak masuk akal');
  return true;
}
// saran "mungkin sudah ada" saat mengetik nama, supaya tidak dobel
function bindSimilar(root,pre,exclude,onPick,pickLabel){
  const inp=root.querySelector('#'+pre+'nl'), box=root.querySelector('#'+pre+'sim');
  const draw=()=>{
    const q=inp.value; if(normName(q).length<3){ box.innerHTML=''; return; }
    const res=searchPeople(q,exclude).slice(0,4);
    box.innerHTML=res.length?`<div class="simbox"><div class="simt">${ic('triangle-alert')} Mungkin orangnya sudah ada di daftar?</div>${res.map(p=>choiceHTML(p,`data-pick="${p.id}"`,`<span class="pickbtn">${esc(pickLabel)}</span>`)).join('')}</div>`:'';
    box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>onPick(b.dataset.pick));
  };
  inp.addEventListener('input',draw); draw();
}
function openWizard(startPid){
  document.querySelectorAll('.wiz').forEach(x=>x.remove());
  wz={pid:startPid&&P(startPid)?startPid:null, step:startPid&&P(startPid)?'profil':'who', mode:'self', union:null};
  const o=document.createElement('div'); o.className='wiz';
  o.innerHTML=`<div class="wizbox"><div class="wizhead"><h3 id="wzTitle"></h3><span id="wzSync" class="wzsync"></span><button class="btn iconbtn" id="wzClose" title="Tutup">${ic('x')}</button></div>
    <div class="wizsteps" id="wzSteps"></div><div class="wizbody" id="wzBody"></div><div class="wizfoot" id="wzFoot"></div>${domisiliOptions()}</div>`;
  document.body.appendChild(o);
  o.querySelector('#wzClose').onclick=closeWizard;
  updateWzSync(); wzRender();
}
function closeWizard(){ document.querySelectorAll('.wiz').forEach(x=>x.remove()); wz=null; refresh(); }
function updateWzSync(){
  const el=document.getElementById('wzSync'), st=document.getElementById('driveStatus'); if(!el||!st) return;
  el.className='wzsync '+st.className.replace('drivestatus','').trim(); el.innerHTML=st.innerHTML.replace('class="stx"','');
}
function wzGo(step){ wz.step=step; wzRender(); document.getElementById('wzBody').scrollTop=0; }
function wzRender(){
  if(!wz) return;
  const body=document.getElementById('wzBody'), foot=document.getElementById('wzFoot'), title=document.getElementById('wzTitle');
  const si=WZ_STEPS.indexOf(wz.step);
  document.getElementById('wzSteps').innerHTML=si>=0?WZ_STEPS.map((s,i)=>`<span class="${i<=si?'on':''}"></span>`).join(''):'';
  const footer=(back,nextLabel,next)=>{
    foot.innerHTML=`${back?'<button class="btn" id="wzBack">'+ic('chevron-left')+' Kembali</button>':''}${next?`<button class="btn primary" id="wzNext">${nextLabel}</button>`:''}`;
    if(back) foot.querySelector('#wzBack').onclick=back;
    if(next) foot.querySelector('#wzNext').onclick=next;
  };
  const s=wz.step, pid=wz.pid, me=pid&&P(pid);
  /* --- 1. siapa yang didata --- */
  if(s==='who'){
    title.textContent='Isi data keluarga';
    body.innerHTML=`<div class="wnote">${ic('info')} Formulir ini untuk melengkapi silsilah. Bisa untuk <b>diri sendiri</b> atau <b>orang lain</b> (mis. orang tua, sesepuh, anak).</div>
      <div class="wf"><label>Data siapa yang mau diisi?</label>
      <div class="big-seg" id="wMode"><button type="button" data-v="self" class="${wz.mode==='self'?'on':''}">${ic('user-round')} Diri saya</button><button type="button" data-v="other" class="${wz.mode==='other'?'on':''}">${ic('users-round')} Orang lain</button></div>
      <label id="wQl">${wz.mode==='self'?'Cari namamu':'Cari nama orangnya'}</label><input id="wQ" placeholder="Ketik nama atau panggilan…" autocomplete="off"></div>
      <div id="wRes"></div>
      <button class="choice addnew" id="wNew">${ic('plus')} <span class="ctxt"><b>Belum ada di daftar</b><span class="ctx">Tambahkan sebagai orang baru</span></span></button>`;
    const q=body.querySelector('#wQ'), res=body.querySelector('#wRes');
    const draw=()=>{
      let list=searchPeople(q.value);
      if(!q.value.trim() && wz.mode==='self' && meId && P(meId)) list=[P(meId)];
      res.innerHTML=list.map(p=>choiceHTML(p,`data-id="${p.id}"`,p.id===meId?'<span class="pickbtn">Kamu</span>':'')).join('') || (q.value.trim().length>=2?'<div class="hint" style="padding:6px 2px">Tidak ditemukan. Pakai tombol “Belum ada di daftar”.</div>':'');
      res.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{ wz.pid=b.dataset.id; if(wz.mode==='self') setMe(wz.pid); wzGo('profil'); });
    };
    body.querySelectorAll('#wMode button').forEach(b=>b.onclick=()=>{ wz.mode=b.dataset.v; body.querySelectorAll('#wMode button').forEach(x=>x.classList.toggle('on',x===b)); body.querySelector('#wQl').textContent=wz.mode==='self'?'Cari namamu':'Cari nama orangnya'; draw(); });
    q.oninput=draw; draw();
    body.querySelector('#wNew').onclick=()=>{ wz.newName=q.value.trim(); wzGo('baru'); };
    footer(null,null,null);
    return;
  }
  /* --- orang baru + dihubungkan ke keluarga --- */
  if(s==='baru'){
    title.textContent='Tambah orang baru';
    wz.link=wz.link||{type:'anak',id:null};
    body.innerHTML=personFieldsHTML('n_',{namaLengkap:wz.newName||''})+`
      <div class="wf"><label>Hubungkan ke keluarga *</label>
      <div class="hint" style="margin:0 0 8px">Supaya muncul di pohon, pilih salah satu orang tua ATAU pasangannya.</div>
      <div class="big-seg" id="lType"><button type="button" data-v="anak" class="${wz.link.type==='anak'?'on':''}">Anak dari…</button><button type="button" data-v="pasangan" class="${wz.link.type==='pasangan'?'on':''}">Suami/istri dari…</button></div>
      <input id="lQ" placeholder="Cari nama ayah/ibu atau pasangannya…" autocomplete="off" style="margin-top:10px"></div>
      <div id="lSel"></div><div id="lRes"></div>`;
    bindSeg(body);
    bindSimilar(body,'n_',[],id=>{ wz.pid=id; if(wz.mode==='self') setMe(id); toast('Memakai data '+nick(id)+' yang sudah ada'); wzGo('profil'); },'Ini orangnya');
    const lq=body.querySelector('#lQ'), lres=body.querySelector('#lRes'), lsel=body.querySelector('#lSel');
    const drawSel=()=>{ lsel.innerHTML=wz.link.id?`<div class="selbox">${ic('check')} ${wz.link.type==='anak'?'Anak dari':'Pasangan dari'} ${choiceHTML(P(wz.link.id),'disabled')}</div>`:''; };
    const drawRes=()=>{ const list=searchPeople(lq.value).slice(0,8);
      lres.innerHTML=list.map(p=>choiceHTML(p,`data-l="${p.id}"`)).join('');
      lres.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ wz.link.id=b.dataset.l; lq.value=''; lres.innerHTML=''; drawSel(); }); };
    body.querySelectorAll('#lType button').forEach(b=>b.addEventListener('click',()=>{ wz.link.type=b.dataset.v; drawSel(); }));
    lq.oninput=drawRes; drawSel();
    footer(()=>wzGo('who'),'Simpan & lanjut '+ic('chevron-right'),()=>{
      const d=readPerson(body,'n_'); if(!validPerson(body,'n_',d)) return;
      if(!wz.link.id){ toast('Pilih orang tua atau pasangannya dulu','error'); lq.focus(); return; }
      const id=addPerson(d);
      if(wz.link.type==='anak') addChild(wz.link.id,id); else addSpouse(wz.link.id,id);
      wz.pid=id; wz.link=null; if(wz.mode==='self') setMe(id);
      toast('Tersimpan: '+d.namaLengkap); wzGo('pasangan');
    });
    return;
  }
  if(!me){ wzGo('who'); return; }
  /* --- 2. profil --- */
  if(s==='profil'){
    title.textContent='Data '+nick(pid);
    body.innerHTML=`<div class="wnote small">${esc(personCtx(pid))||'Lengkapi datanya di bawah ini.'}</div>`+personFieldsHTML('p_',me);
    bindSeg(body);
    footer(()=>wzGo('who'),'Simpan & lanjut '+ic('chevron-right'),()=>{
      const d=readPerson(body,'p_'); if(!validPerson(body,'p_',d)) return;
      Object.assign(me,d); save(); wzGo('pasangan');
    });
    return;
  }
  /* --- 3. pasangan --- */
  if(s==='pasangan'){
    title.textContent='Pasangan '+nick(pid);
    const sps=unionsOf(pid).filter(u=>u.partners.length===2);
    body.innerHTML=`${sps.length?`<div class="wf"><label>Sudah tercatat</label></div>`+sps.map(u=>{ const s2=u.partners.find(x=>x!==pid); return choiceHTML(P(s2),'disabled',u.status==='cerai'?'<span class="pickbtn">cerai</span>':''); }).join(''):'<div class="wnote small">Belum ada pasangan tercatat. Kalau belum menikah, langsung tekan <b>Lanjut</b>.</div>'}
      <button class="choice addnew" id="spAdd">${ic('plus')} <span class="ctxt"><b>Tambah ${sps.length?'pasangan lain':'pasangan'}</b><span class="ctx">Suami / istri</span></span></button>
      <div id="spForm"></div>`;
    body.querySelector('#spAdd').onclick=()=>{
      const f=body.querySelector('#spForm'); body.querySelector('#spAdd').style.display='none';
      f.innerHTML=`<div class="subcard"><div class="subt">Pasangan baru</div>${personFieldsHTML('s_',{},{jk:me.jk==='L'?'P':me.jk==='P'?'L':''})}
        <button class="btn primary wbtn" id="spSave">Simpan pasangan</button></div>`;
      bindSeg(f);

/* ============ GOOGLE DRIVE SYNC ============ */
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME='silsilah-keluarga.json';
let CLIENT_ID=localStorage.getItem('g_client_id')||'1078509892418-saoqsvkc6omioqh098m3c4a18h2d8gng.apps.googleusercontent.com';
let tokenClient=null, accessToken=null, tokenExpiry=0;
let driveFileId=localStorage.getItem('drive_file_id')||null;
let driveConnected=false, pushTimer=null;

function gisReady(){ return !!(window.google&&google.accounts&&google.accounts.oauth2); }
function initToken(){
  if(!CLIENT_ID || !gisReady()) return false;
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:DRIVE_SCOPE,callback:()=>{}});
  return true;
}
function getToken(interactive){
  return new Promise((resolve,reject)=>{
    if(accessToken && Date.now()<tokenExpiry-60000) return resolve(accessToken);
    if(!tokenClient && !initToken()) return reject(new Error('Google belum siap'));
    tokenClient.callback=(r)=>{ if(r&&r.access_token){ accessToken=r.access_token; tokenExpiry=Date.now()+((r.expires_in||3600)*1000); resolve(accessToken); } else reject(r||new Error('Token gagal')); };
    try{ tokenClient.requestAccessToken({prompt: interactive?'':'none'}); }catch(e){ reject(e); }
  });
}
async function driveReq(url,opts){
  const t=await getToken(false).catch(()=>getToken(true));
  opts=opts||{}; opts.headers=Object.assign({Authorization:'Bearer '+t}, opts.headers||{});
  let res=await fetch(url,opts);
  if(res.status===401){ accessToken=null; const t2=await getToken(true); opts.headers.Authorization='Bearer '+t2; res=await fetch(url,opts); }
  if(!res.ok){ const tx=await res.text().catch(()=>''); throw new Error('Drive '+res.status+' '+tx.slice(0,140)); }
  return res;
}
async function driveFind(){
  if(driveFileId){ try{ const r=await driveReq('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?fields=id,trashed'); const d=await r.json(); if(d.id && !d.trashed) return {id:d.id}; }catch(e){} }
  const q="name='"+DRIVE_FILENAME+"' and trashed=false";
  const r=await driveReq('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q='+encodeURIComponent(q));
  const d=await r.json(); return (d.files&&d.files[0])||null;
}
async function driveDownload(id){ const r=await driveReq('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media'); return r.json(); }
async function driveCreate(content){
  const r=await driveReq('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FILENAME,mimeType:'application/json'})});
  const d=await r.json(); await driveUpdate(d.id,content); return d.id;
}
async function driveUpdate(id,content){
  await driveReq('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(content)});
}
function schedulePush(){
  if(FAMILY_API){ famSchedule(); return; }
  if(!driveConnected||!driveFileId) return;
  setStatus('saving'); clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{ try{ await driveUpdate(driveFileId,state); setStatus('saved'); }catch(e){ console.error(e); setStatus('error'); } },1200);
}
async function connectDrive(interactive){
  if(!CLIENT_ID){ if(interactive) driveModal(); return; }
  try{
    await getToken(interactive);
    const f=await driveFind();
    if(f){
      driveFileId=f.id; localStorage.setItem('drive_file_id',f.id);
      const remote=await driveDownload(f.id);
      const remoteEmpty=!remote||!Array.isArray(remote.people)||remote.people.length===0;
      const same=JSON.stringify(remote)===JSON.stringify(state);
      if(remoteEmpty && state.people.length>0){ await driveUpdate(f.id,state); }       // jangan timpa data lokal dengan kosong
      else if(state.people.length===0 || same || !interactive){ if(!remoteEmpty){ state=remote; repairUnions(); } }
      else { const c=await chooseConflict(); if(c==='drive'){ state=remote; repairUnions(); } else { await driveUpdate(f.id,state); } }
    } else {
      driveFileId=await driveCreate(state); localStorage.setItem('drive_file_id',driveFileId);
    }
    driveConnected=true; localStorage.setItem('silsilah-data',JSON.stringify(state));
    rootId=null; autoRoot=null; setStatus('saved'); updateDriveBtn(); refresh(); fit();
    if(interactive) toast('Tersambung ke Google Drive');
  }catch(e){ console.error(e); if(interactive) toast('Gagal menyambung. Periksa Client ID & origin. ('+(e.message||'')+')','error'); }
}
function disconnectDrive(){ accessToken=null; driveConnected=false; setStatus('off'); updateDriveBtn(); toast('Terputus dari Drive — data lokal tetap tersimpan.'); }
function chooseConflict(){
  return new Promise(res=>{
    const o=modal('<h3>Data berbeda</h3><div class="mbody">Data di Google Drive berbeda dengan data di perangkat ini. Mana yang ingin dipakai?<br><span class="hint">Yang tidak dipilih akan tertimpa.</span></div><div class="mfoot"><button class="btn" id="cf_local">Pakai data perangkat ini</button><button class="btn primary" id="cf_drive">Pakai data Drive</button></div>');
    o.querySelector('#cf_drive').onclick=()=>{o.remove();res('drive');};
    o.querySelector('#cf_local').onclick=()=>{o.remove();res('local');};

}
function setStatus(s){

  const map=FAMILY_API
    ? {off:['off','cloud-off','Belum tersambung'],saving:['saving','refresh-cw','Menyinkronkan…'],saved:['saved','check','Tersinkron'],error:['error','triangle-alert','Gagal sinkron']}

function driveModal(){
  const o=modal('<h3>Google Drive</h3><div class="mbody">'+
    '<div class="hint">Tempel <b>Client ID</b> dari Google Cloud, lalu Login. Data silsilah disimpan ke satu file (<b>'+DRIVE_FILENAME+'</b>) di Drive-mu; aplikasi hanya bisa mengakses file itu, bukan file lainmu.</div>'+
    '<div class="frow"><label>Google Client ID</label><input id="g_cid" placeholder="...apps.googleusercontent.com" value="'+esc(CLIENT_ID)+'"></div>'+

    o.remove(); connectDrive(true);
  };
  const out=o.querySelector('#g_out'); if(out) out.onclick=()=>{ o.remove(); disconnectDrive(); };

  setStatus('off'); updateDriveBtn();
  document.getElementById('btnDrive').onclick=driveModal;
  document.getElementById('driveStatus').onclick=driveModal;

/* ============ SERVER KELUARGA (Apps Script) ============
   Bila FAMILY_API diisi: tanpa login Google. Anggota cukup memasukkan kode keluarga sekali
   per perangkat; data dimuat dari server, perubahan tersimpan otomatis & perubahan orang lain
   ikut muncul. Bila dua orang mengubah bersamaan, perubahan keduanya digabung (per orang/keluarga).
   Bila FAMILY_API kosong, aplikasi memakai mode lama (Hubungkan Drive).
*/
const DEFAULT_FAMILY_API = 'https://script.google.com/macros/s/AKfycbygajCuVXpw3TONzUA6HE-7bm2gafz-dUdRrt41ay9dwAU-XVpuwfPKCw6aH0J1zuiQ/exec';                   // URL web app Apps Script (…/exec), diisi setelah server dipasang
const FAMILY_API = lsGet('family_api') || DEFAULT_FAMILY_API;
const fam={code:null,rev:null,base:null,ready:false,busy:false,dirty:false,timer:null,lastSync:null,warned:false};
const clone=x=>JSON.parse(JSON.stringify(x));
async function famApi(action,payload){
  const res=await fetch(FAMILY_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action,code:fam.code},payload))});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
// gabung 3 arah per id: base = versi terakhir yg sama-sama diketahui, mine = punyaku, theirs = di server
// gabung daftar id (anak/pasangan): ambil versi server, + yang kutambah, − yang kuhapus
function merge3Arr(b,m,t){
  b=b||[]; m=m||[]; t=t||[];
  const k=x=>JSON.stringify(x);
  if(k(t)===k(b)) return m.slice();
  if(k(m)===k(b)) return t.slice();
  const res=t.filter(x=>!(b.includes(x)&&!m.includes(x)));
  m.forEach(x=>{ if(!b.includes(x)&&!res.includes(x)) res.push(x); });
  return res;
}
// gabung satu objek per kolom: kolom yg kuubah pakai punyaku, sisanya ikut server
function mergeObj(b,m,t){
  const o={}, k=x=>JSON.stringify(x);
  new Set([...Object.keys(b||{}),...Object.keys(m),...Object.keys(t)]).forEach(f=>{
    const bv=b?b[f]:undefined, mv=m[f], tv=t[f];
    const v=(Array.isArray(mv)||Array.isArray(tv)) ? merge3Arr(bv,mv,tv) : (k(mv)!==k(bv) ? mv : tv);
    if(v!==undefined) o[f]=v;
  });
  return o;
}
// gabung 3 arah per id: base = versi terakhir yg sama-sama diketahui, mine = punyaku, theirs = di server
function mergeList(b,m,t){
  const key=x=>JSON.stringify(x);
  const B=new Map((b||[]).map(x=>[x.id,x])), M=new Map((m||[]).map(x=>[x.id,x])), T=new Map((t||[]).map(x=>[x.id,x]));
  const res=[], seen=new Set();
  [...T.keys(),...M.keys()].forEach(id=>{
    if(seen.has(id)) return; seen.add(id);
    const bx=B.get(id), mx=M.get(id), tx=T.get(id);
    let pick;
    if(!bx) pick=mx||tx;                                   // baru ditambahkan (di salah satu sisi)
    else if(!mx) pick=null;                               // aku menghapusnya
    else if(key(mx)===key(bx)) pick=tx;                   // aku tidak mengubah -> ikut server (termasuk bila dihapus)
    else if(!tx || key(tx)===key(bx)) pick=mx;            // hanya aku yg mengubah
    else pick=mergeObj(bx,mx,tx);                         // sama-sama mengubah -> gabung per kolom
    if(pick) res.push(clone(pick));
  });
  return res;
}
function mergeStates(base,mine,theirs){
  const out={people:mergeList(base.people,mine.people,theirs.people), unions:mergeList(base.unions,mine.unions,theirs.unions)};
  const bs=JSON.stringify(base.settings||null), ms=JSON.stringify(mine.settings||null);
  const st=ms!==bs ? mine.settings : theirs.settings; if(st) out.settings=clone(st);
  const ids=new Set(out.people.map(p=>p.id));             // buang rujukan ke orang yg sudah tak ada
  out.unions.forEach(u=>{ u.partners=u.partners.filter(id=>ids.has(id)); u.children=u.children.filter(id=>ids.has(id)); });
  out.unions=out.unions.filter(u=>u.partners.length>0||u.children.length>0);
  return out;
}
function applyRemote(data,rev,initial){
  fam.rev=rev; fam.base=clone(data); fam.ready=true; fam.lastSync=new Date();
  state=clone(data); repairUnions();
  localStorage.setItem('silsilah-data',JSON.stringify(state));
  if(initial){ rootId=null; autoRoot=null; refresh(); fit(); } else refresh();
  setStatus('saved');
}
async function famLoad(initial){
  const r=await famApi('load',{known:initial?null:fam.rev});
  if(!r.ok){ if(r.error==='wrong_code'){ famGate(true); return; } throw new Error(r.error); }
  fam.lastSync=new Date();
  if(r.unchanged){ setStatus('saved'); return; }
  if(fam.dirty||fam.busy) return;                         // ada perubahanku yg belum terkirim -> digabung saat menyimpan
  applyRemote(r.data,r.rev,initial);
}
function famSchedule(){
  if(!fam.ready){ if(!fam.warned){ fam.warned=true; toast('Belum tersambung ke server keluarga — perubahan ini belum tersimpan.','error'); } setStatus('error'); return; }
  fam.dirty=true; setStatus('saving');
  clearTimeout(fam.timer); fam.timer=setTimeout(famPush,1200);
}
async function famPush(){
  if(fam.busy||!fam.dirty) return;
  fam.busy=true; fam.dirty=false; setStatus('saving');
  const sending=clone(state); let retry=300;
  try{
    const r=await famApi('save',{rev:fam.rev,data:sending});
    if(r.ok){ fam.base=sending; fam.rev=r.rev; fam.lastSync=new Date(); }
    else if(r.error==='conflict'){
      // orang lain menyimpan duluan: gabungkan lalu kirim ulang
      state=mergeStates(fam.base||{people:[],unions:[]}, state, r.data);
      fam.base=clone(r.data); fam.rev=r.rev; fam.dirty=true;
      localStorage.setItem('silsilah-data',JSON.stringify(state)); refresh();
    }
    else if(r.error==='wrong_code'){ famGate(true); return; }
    else if(r.error==='too_many_deletes'){
      toast('Server menolak: terlalu banyak orang terhapus sekaligus. Data dikembalikan.','error');
      fam.dirty=false; const l=await famApi('load',{}); if(l.ok) applyRemote(l.data,l.rev,false); return;
    }
    else throw new Error(r.message||r.error);
  }catch(e){ console.error(e); fam.dirty=true; retry=15000; setStatus('error'); }
  finally{
    fam.busy=false;
    if(fam.dirty){ clearTimeout(fam.timer); fam.timer=setTimeout(famPush,retry); }
    else setStatus('saved');
  }
}
// layar kode keluarga
function famGate(wrong){
  fam.ready=false; clearTimeout(fam.timer);
  if(wrong){ fam.code=null; lsSet('family_code',null); }
  state={people:[],unions:[]}; localStorage.removeItem('silsilah-data'); selectedId=null; rootId=null; refresh();
  setStatus('off');
  document.querySelectorAll('.famgate').forEach(x=>x.remove());
  const g=document.createElement('div'); g.className='overlay famgate';
  g.innerHTML=`<div class="modal" style="width:380px"><div class="mbody" style="text-align:center;padding:26px 22px">
    <div style="color:var(--accent)">${ic('tree-deciduous','xl')}</div><h2 style="margin:6px 0 4px;font-size:20px">Happy Family</h2>
    <div class="hint" style="font-size:13px;line-height:1.5">Masukkan <b>kode keluarga</b> untuk membuka silsilah.<br>Kodenya bisa ditanyakan di grup keluarga.</div>
    <input id="fg_code" class="search" style="font-size:16px;text-align:center;margin:12px 0 8px;padding:11px" placeholder="Kode keluarga" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="fg_err" style="color:var(--danger);font-size:12.5px;min-height:18px">${wrong?'Kode salah atau sudah diganti. Coba lagi.':''}</div>
    <button class="btn primary" id="fg_go" style="width:100%;justify-content:center;padding:11px;font-size:15px">Buka silsilah</button>
  </div></div>`;
  document.body.appendChild(g);
  const inp=g.querySelector('#fg_code'), err=g.querySelector('#fg_err'), go=g.querySelector('#fg_go');
  const submit=async()=>{
    const c=inp.value.trim(); if(!c){ inp.focus(); return; }
    go.disabled=true; go.textContent='Memeriksa…'; err.textContent='';
    fam.code=c;
    try{
      const r=await famApi('load',{});
      if(!r.ok){ err.textContent=r.error==='wrong_code'?'Kode salah. Coba lagi.':'Server bermasalah: '+r.error; fam.code=null; }
      else { lsSet('family_code',c); g.remove(); applyRemote(r.data,r.rev,true); startFamPolling(); }
    }catch(e){ err.textContent='Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.'; fam.code=null; }
    go.disabled=false; go.textContent='Buka silsilah';
  };
  go.onclick=submit; inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  setTimeout(()=>inp.focus(),50);
}
let famPoll=null;
function startFamPolling(){
  if(famPoll) return;
  const tick=()=>{ if(document.hidden||!fam.code||fam.busy||fam.dirty||document.querySelector('.famgate')) return; famLoad(!fam.ready).catch(()=>setStatus('error')); };
  famPoll=setInterval(tick,30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });
}
function famInfo(){
  const t=fam.lastSync?fam.lastSync.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-';
  const o=modal(`<h3>Sinkron keluarga</h3><div class="mbody" style="font-size:13.5px;line-height:1.55">
    Data tersimpan di server keluarga dan otomatis tersinkron ke semua perangkat — tidak perlu login.<br><br>
    Terakhir sinkron: <b>${esc(t)}</b>${fam.dirty||fam.busy?'<br><span style="color:#854d0e">Ada perubahan yang sedang dikirim…</span>':''}
    </div><div class="mfoot"><button class="btn danger" id="fi_out">Lupakan kode di perangkat ini</button><button class="btn" id="fi_close">Tutup</button><button class="btn primary" id="fi_sync">Sinkron sekarang</button></div>`);
  o.querySelector('#fi_close').onclick=()=>o.remove();
  o.querySelector('#fi_sync').onclick=()=>{ o.remove(); setStatus('saving'); (fam.dirty?famPush():famLoad(!fam.ready)).catch(()=>setStatus('error')); };
  o.querySelector('#fi_out').onclick=()=>{ o.remove(); confirmDialog('Lupakan kode keluarga di perangkat ini? Kamu perlu memasukkan kodenya lagi untuk membuka silsilah.',()=>famGate(false),'Lupakan',true); };
}
function bootFamily(){
  ['btnDrive','btnReset','hrReset'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
  document.getElementById('driveStatus').onclick=famInfo;
  window.addEventListener('beforeunload',e=>{ if(fam.dirty||fam.busy){ e.preventDefault(); e.returnValue=''; } });
  fam.code=lsGet('family_code');
  // link undangan: keluarga.masmik.id/#kode=… langsung masuk tanpa mengetik kode
  const hm=location.hash.match(/kode=([^&]+)/);
  if(hm){ history.replaceState(null,'',location.pathname+location.search); const c=decodeURIComponent(hm[1]).trim(); if(c && c!==fam.code){ fam.code=c; lsSet('family_code',c); } }
  if(!fam.code){ famGate(false); return; }
  setStatus('saving');                                  // tampilkan data terakhir di perangkat dulu, lalu muat dari server
  famLoad(true).catch(()=>{ setStatus('error'); toast('Server keluarga tidak terjangkau — menampilkan data terakhir di perangkat ini.','error'); });
  startFamPolling();
}

/* ============ INIT ============ */
repairUnions(); localStorage.setItem('silsilah-data', JSON.stringify(state));
refresh();
setTimeout(fit,100);
if(FAMILY_API) bootFamily(); else bootDrive();
</script>
</body>
